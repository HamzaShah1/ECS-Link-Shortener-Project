name: CI pipeline - test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest app/tests

      - name: Test Worker
        working-directory: services/worker
        run: go test ./...

      - name: Test Dashboard
        working-directory: services/dashboard
        run: go test ./...

      - name: Build Docker images
        run: |
          docker build --platform linux/amd64 -t app-image app/
          docker build --platform linux/amd64 -t worker-image services/worker/
          docker build --platform linux/amd64 -t dashboard-image services/dashboard/

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity
  
  publish-to-ecr:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: authenticate AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: build the API image and push to ECR
        run: |
          docker buildx build \
            --push --platform linux/amd64 \
            -t ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_API_REPOSITORY }}:${{ github.sha }} \
            -t ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_API_REPOSITORY }}:latest \
            app/

      - name: build the worker image and push to ECR
        run: |
          docker buildx build \
            --push --platform linux/amd64 \
            -t ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_WORKER_REPOSITORY }}:${{ github.sha }} \
            -t ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_WORKER_REPOSITORY }}:latest \
            services/worker

      - name: build the Dashboard image and push to ECR
        run: |
          docker buildx build \
            --push --platform linux/amd64 \
            -t ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_DASHBOARD_REPOSITORY }}:${{ github.sha }} \
            -t ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_DASHBOARD_REPOSITORY }}:latest \
            services/dashboard