name: CI pipeline - test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest app/tests

      - name: Test Worker
        working-directory: services/worker
        run: go test ./...

      - name: Test Dashboard
        working-directory: services/dashboard
        run: go test ./...

      - name: Build Docker images
        run: |
          docker build --platform linux/amd64 -t app-image app/
          docker build --platform linux/amd64 -t worker-image services/worker/
          docker build --platform linux/amd64 -t dashboard-image services/dashboard/

  aws-auth-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Inspect OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            tokenUrl.searchParams.set('audience', 'sts.amazonaws.com');

            const response = await fetch(tokenUrl, {
              headers: {
                Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
              }
            });

            if (!response.ok) {
              throw new Error(`OIDC request failed: ${response.status}`);
            }

            const data = await response.json();
            const payload = JSON.parse(
              Buffer.from(data.value.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC subject:', payload.sub);
            console.log('OIDC audience:', payload.aud);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity