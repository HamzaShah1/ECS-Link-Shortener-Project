name: CI pipleine - test

on: 
  [push, pull_request]

jobs:
  aws-auth-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses:  actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: setup go runner
        uses: actions/setup-go@v5
        with: 
          go-version: '1.24'
        
      - name: install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run pytest
        run:  pytest app/tests

      - name: test worker
        working-directory: services/worker
        run: | 
            go test ./...

      - name: test dashboard
        working-directory: services/dashboard
        run: | 
            go test ./...

      - name: build docker images
        run: |
            docker build --platform linux/amd64 -t app-image app/
            docker build --platform linux/amd64 -t worker-image services/worker/
            docker build --platform linux/amd64 -t dashboard-image services/dashboard/

