name: CD pipeline - deployment

on:
  workflow_run: 
    workflows: ["CI pipeline - test"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get base commit
        id: base
        run: |
          BASE_SHA=$(git rev-parse "${{ github.event.workflow_run.head_sha }}^")
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: detect changed services
        uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ steps.base.outputs.sha }}
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            api:
              - 'app/**'
            worker:
              - 'services/worker/**'
            dashboard:
              - 'services/dashboard/**'
            docs:
              - '*.md'
              - 'docs/**'

      - name: show changed services
        run: |
          echo "API: ${{ steps.changes.outputs.api }}"
          echo "Worker: ${{ steps.changes.outputs.worker }}"
          echo "Dashboard: ${{ steps.changes.outputs.dashboard }}"
          echo "Docs: ${{ steps.changes.outputs.docs }}"
      
      - name: Deploy API
        if: steps.changes.outputs.api == 'true'
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services api \
            --query 'services[0].taskDefinition' \
            --output text)
          
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            > api-task-definition.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' api-task-definition.json > cleaned.json
          mv cleaned.json api-task-definition.json
          jq '.containerDefinitions[0].image = "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_API_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}"' \
            api-task-definition.json > updated.json
          mv updated.json api-task-definition.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://api-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service api \
            --task-definition "$NEW_TASK_DEF_ARN"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services api

      - name: Deploy worker
        if: steps.changes.outputs.worker == 'true'
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services worker \
            --query 'services[0].taskDefinition' \
            --output text)
          
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            > worker-task-definition.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' worker-task-definition.json > cleaned.json
          mv cleaned.json worker-task-definition.json
          jq '.containerDefinitions[0].image = "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_WORKER_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}"' \
            worker-task-definition.json > updated.json
          mv updated.json worker-task-definition.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://worker-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service worker \
            --task-definition "$NEW_TASK_DEF_ARN"
          
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services worker

      - name: Deploy Dashboard
        if: steps.changes.outputs.dashboard == 'true'
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services dashboard \
            --query 'services[0].taskDefinition' \
            --output text)
          
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            > dashboard-task-definition.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' dashboard-task-definition.json > cleaned.json
          mv cleaned.json dashboard-task-definition.json
          jq '.containerDefinitions[0].image = "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_DASHBOARD_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}"' \
            dashboard-task-definition.json > updated.json
          mv updated.json dashboard-task-definition.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://dashboard-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service dashboard \
            --task-definition "$NEW_TASK_DEF_ARN"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services dashboard

